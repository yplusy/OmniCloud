name: 🚀 Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      APP_NAME: ${{ vars.APP_NAME || 'omnicloud' }}
      DB_NAME: ${{ vars.DB_NAME || 'omnicloud-db' }}
      DEPLOY_TYPE: ${{ vars.DEPLOY_TYPE || 'workers' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check or Create D1 Database
        run: |
          set -euo pipefail

          DB_ID=$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name == env.DB_NAME) | .uuid')

          if [ -z "$DB_ID" ]; then
            echo "📦 未找到数据库'$DB_NAME'，正在创建..."
            DB_ID=$(pnpm exec wrangler d1 create "$DB_NAME" --update-config --binding "DB" | grep -oE "[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}")
          fi

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "❌ 无法获取数据库'$DB_NAME'的有效 UUID" >&2
            exit 1
          fi

          echo "✅ 数据库'$DB_NAME'(UUID: ${DB_ID:0:8}...)"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Inject Configuration to wrangler.jsonc
        run: |
          if [ "$DEPLOY_TYPE" = "workers" ]; then
            export MODE_CONFIG='"main": ".svelte-kit/cloudflare/_worker.js", "assets": { "binding": "ASSETS", "directory": ".svelte-kit/cloudflare" }'
          else
            export MODE_CONFIG='"pages_build_output_dir": ".svelte-kit/cloudflare"'
          fi
          envsubst '${APP_NAME} ${MODE_CONFIG} ${DB_NAME} ${DB_ID}' < wrangler.template.jsonc > wrangler.jsonc

      - run: pnpm run build

      - name: Deploy Workers / Pages
        run: |
          echo "📦 部署类型: $DEPLOY_TYPE"
          echo "🗄️ 使用数据库 ID: $DB_ID"
          if [[ "$DEPLOY_TYPE" == "workers" ]]; then
            pnpm exec wrangler deploy
          else
            pnpm exec wrangler pages project create "$APP_NAME" --production-branch main || true
            pnpm exec wrangler pages deploy
          fi
